name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -r -n 1 node --check
      - name: Run offline regression tests
        run: |
          set -euo pipefail
          # test-solvable.mjs is a heuristic sweep with a 2 s wall-clock budget
          # per rack; it times out on hard racks on slower shared runners.
          # Run it locally when the rack generator or dictionary changes.
          for test in scripts/test-*.mjs; do
            [ "$test" = scripts/test-solvable.mjs ] && continue
            node "$test"
          done
